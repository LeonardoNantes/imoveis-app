<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Imóveis</title>
  <meta name="theme-color" content="#0d2c4a">
  <meta name="description" content="Imóveis para temporada, aluguel e venda">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-modelo="classico">

  <div id="tela-carregando" class="tela-central">
    <div class="spinner"></div>
  </div>

  <div id="tela-erro" class="tela-central hidden">
    <div class="erro-caixa">
      <div style="font-size:42px">🏠</div>
      <h2>Página não encontrada</h2>
      <p>Este link não está disponível no momento. Confira com quem enviou o link para você.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topo" id="topo">
      <div class="topo-marca">
        <div class="topo-logo" id="topo-logo"></div>
        <div class="topo-nome" id="topo-nome"></div>
      </div>
      <a class="topo-wpp hidden" id="topo-wpp" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3a.4.4 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3Z"/></svg>
        <span>WhatsApp</span>
      </a>
    </header>

    <section class="hero" id="hero">
      <div class="hero-conteudo">
        <h1 id="hero-titulo"></h1>
        <p id="hero-sub"></p>
        <div class="hero-corretor hidden" id="hero-corretor"></div>
      </div>
    </section>

    <nav class="abas" id="abas"></nav>

    <div class="barra-filtro" id="barra-filtro">
      <button class="btn-filtro" id="btn-filtro">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 5h18v2H3zm4 6h10v2H7zm3 6h4v2h-4z"/></svg>
        Filtrar <span class="badge hidden" id="filtro-badge"></span>
      </button>
      <div class="chips-ativos" id="chips-ativos"></div>
    </div>

    <main class="vitrine">
      <p class="contagem" id="contagem"></p>
      <div class="grade" id="grade"></div>
    </main>

    <footer class="rodape" id="rodape"></footer>
  </div>

  <!-- Filtros -->
  <div class="folha-fundo hidden" id="folha-filtro">
    <div class="folha">
      <div class="folha-topo">
        <h2>Filtrar</h2>
        <button class="btn-x" data-fechar aria-label="Fechar">✕</button>
      </div>
      <div class="folha-corpo" id="filtro-corpo"></div>
      <div class="folha-rodape">
        <button class="btn btn-claro" id="filtro-limpar">Limpar</button>
        <button class="btn btn-destaque" id="filtro-aplicar">Ver imóveis</button>
      </div>
    </div>
  </div>

  <!-- Detalhe do imóvel -->
  <div class="detalhe hidden" id="detalhe">
    <div class="detalhe-topo">
      <button class="btn-redondo" id="detalhe-voltar" aria-label="Voltar">←</button>
      <button class="btn-redondo" id="detalhe-compartilhar" aria-label="Compartilhar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1Z"/></svg>
      </button>
    </div>
    <div class="detalhe-scroll" id="detalhe-scroll"></div>
    <div class="detalhe-acao" id="detalhe-acao"></div>
  </div>

  <!-- Foto em tela cheia -->
  <div class="foto-cheia hidden" id="foto-cheia">
    <button class="btn-redondo" id="foto-cheia-fechar" aria-label="Fechar">✕</button>
    <div class="foto-cheia-trilho" id="foto-cheia-trilho"></div>
  </div>

  <div class="aviso hidden" id="aviso"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
